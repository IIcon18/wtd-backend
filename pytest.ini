[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers used in this project
markers =
    anyio: marks tests as async via anyio
    unit: fast unit tests (no DB/network)
    integration: tests that hit real DB and Redis
    e2e: end-to-end scenario tests

# Output
addopts = -v --tb=short
